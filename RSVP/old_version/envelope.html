<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sobre - Invitación</title>
  <link rel="stylesheet" href="styles/invitation.css" />
  <style>
    .envelope-hero{ min-height:100vh; display:grid; place-items:center; padding:2rem; background:#faf7f6 }
    .envelope-card{ max-width:820px; width:100%; text-align:center }
    .envelope-img{ width:100%; height:auto; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.12) }
    .seal{ width:96px; height:auto; margin-top:-48px; display:inline-block }
    .back-link{ display:block; margin-top:1rem; color:var(--accent2); font-weight:600 }
  </style>
</head>
<body>
  <main class="envelope-page">
    <div class="envelope-wrap">
      <h1 class="env-title">Natalina &amp; Eduardo</h1>
      <div class="envelope-figure">
        <button class="envelope-sprite" id="open-envelope" aria-label="Abrir sobre" title="Abrir sobre">
          <span class="sr-only">Abrir sobre - ir a la invitación</span>
        </button>
        <!-- sello que caerá sobre el sobre -->
        <img id="envelope-seal" class="seal-img" src="assets/seal_EN.png" alt="Sello" aria-hidden="true" />
      </div>
      <div class="envelope-note">Haz clic en el sobre para abrir</div>
      <a class="back-link" href="index.html">Inicio</a>
    </div>
  </main>

  <script>
    (function(){
      const btn = document.getElementById('open-envelope');
      if(!btn) return;
      btn.addEventListener('click', ()=>{
        // prevenir clicks adicionales
        btn.disabled = true;
        // hacer que el sello desaparezca (animación) antes de abrir el sobre
        const seal = document.getElementById('envelope-seal');
        if(seal){ seal.classList.add('vanish'); }

        // después de la pequeña animación, cambiar imagen del sobre a abierta
        setTimeout(()=>{
          btn.style.backgroundImage = "url('assets/Open_Envelope.png')";
          btn.classList.add('open');
        }, 360);

        // navegar a la invitación tras el efecto
        setTimeout(()=>{ window.location.href = 'invitation.html'; }, 800);
      });
      btn.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
      });
    })();
  </script>
</body>
</html>
